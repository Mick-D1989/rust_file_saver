[package]
name = "file_saver_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.18", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
futures = { version = "0.3" }

[lib]
name = "file_saver_rust"
crate-type = ["cdylib"]

[package.metadata.maturin]
bindings = "pyo3"