[build-system]
requires = ["setuptools", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "file-saver"
version = "0.1.0"
license = { text = "MIT" }
description = "A simple drag and drop file save application"
readme = "README.md"
authors = [
    { name = "Michael Durante", email = "michaeldurante@hotmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "debugpy>=1.8.12",
    "flask>=3.1.0",
    "flask-cors>=5.0.0",
    "gunicorn>=23.0.0",
    "maturin>=1.8.2",
    "werkzeug>=3.1.3",
]

[tool.setuptools.packages]
# Pure Python packages/modules
# find = { where = ["python3"] }
find = {}

[[tool.setuptools-rust.ext-modules]]
# Private Rust extension module to be nested into the Python package
target = "file_saver_rust"  # The last part of the name (e.g. "_lib") has to match lib.name in Cargo.toml,
                             # but you can add a prefix to nest it inside of a Python package.
path = "file_saver_rust/Cargo.toml"      # Default value, can be omitted
binding = "PyO3"         # Default value, can be omitted

