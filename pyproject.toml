[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "file-saver"
version = "0.1.0"
license = { text = "MIT" }
description = "A simple drag and drop file save application"
readme = "README.md"
authors = [
    { name = "Michael Durante", email = "michaeldurante@hotmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "flask==2.3.2",
    "jinja2>=3.1.5",
    "uvicorn>=0.34.0",
]
